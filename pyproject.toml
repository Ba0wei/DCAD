[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcad"
version = "0.1.0"
description = "DCAD-family anomaly detection for event logs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1", "pm4py>=2.7", "lxml>=4.9", "networkx>=3.0", "untangle>=1.2", "matplotlib>=3.7", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dcad", "dcad.*"]
